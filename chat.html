<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>ChatAI Bob</title>

  <link rel="manifest" href="./manifest.json" />

  <meta name="theme-color" content="#070b14" />

  <meta name="mobile-web-app-capable" content="yes" />

  <meta name="apple-mobile-web-app-capable" content="yes" />

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
    }

    body{
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #111c35 0%,
          #070b14 45%,
          #05070d 100%
        );

      color:#f1f5f9;
    }

    /* =========================
       APP
       ========================= */

    .app{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* =========================
       HEADER
       ========================= */

   .top{
  position:sticky;
  top:0;
  z-index:50;

  width:100%;

  padding:
    calc(12px + env(safe-area-inset-top))
    16px
    12px;

  display:flex;
  align-items:center;
  gap:12px;

  background:rgba(11,15,20,.92);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,.08);

  box-shadow:
    0 8px 30px rgba(0,0,0,.25);
}
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .logo{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          #19c37d,
#0f9f68
);

      font-size:22px;

      box-shadow:
        0 6px 20px rgba(56,189,248,.25);
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .brand-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:.2px;
    }

    .brand-subtitle{
      font-size:11px;
      color:#94a3b8;
    }

    .status{
      display:flex;
      align-items:center;
      gap:7px;

      padding:7px 10px;

      border-radius:999px;

      background:rgba(15,23,42,.85);

      border:1px solid rgba(255,255,255,.08);

      font-size:11px;
      color:#cbd5e1;
    }

    .status-dot{
      width:7px;
      height:7px;

      border-radius:50%;

      background:#22c55e;

      box-shadow:
        0 0 10px rgba(34,197,94,.8);
    }
.menu-btn{
  width:40px;
  height:40px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:1px solid rgba(255,255,255,.08);
  border-radius:12px;

  background:#151b23;
  color:#f4f7fb;

  font-size:22px;
  cursor:pointer;

  transition:
    background .2s ease,
    transform .2s ease;
}

.menu-btn:hover{
  background:#1d262f;
}

.menu-btn:active{
  transform:scale(.94);
}
    /* =========================
       MAIN
       ========================= */

    .wrap{
      width:100%;
      max-width:920px;

      margin:0 auto;

      padding:
        14px
        14px
        calc(14px + env(safe-area-inset-bottom));
    }

    .card{
      width:100%;

      background:
        rgba(8,14,27,.82);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:24px;

      overflow:hidden;

      box-shadow:
        0 20px 60px rgba(0,0,0,.28);
    }

    /* =========================
       MESSAGES
       ========================= */

    #messages{
      height:calc(100vh - 280px);

      min-height:400px;

      overflow-y:auto;

      padding:20px 16px;

      scroll-behavior:smooth;
    }

    #messages::-webkit-scrollbar{
      width:5px;
    }

    #messages::-webkit-scrollbar-thumb{
      background:#263247;
      border-radius:999px;
    }

    .msg{
      width:100%;

      margin:16px 0;

      display:flex;
      flex-direction:column;
    }

    .msg.user{
      align-items:flex-end;
    }

    .avatar{
  flex:0 0 32px;

  width:32px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  background:
    linear-gradient(
      135deg,
      #19c37d,
      #0f9f68
    );

  font-size:16px;

  box-shadow:
    0 5px 18px rgba(25,195,125,.20);
}

    /* =========================
       TYPING
       ========================= */

    .typing{
      display:flex;

      align-items:center;

      gap:5px;
    }

    .typing span{
      width:6px;
      height:6px;

      border-radius:50%;

      background:#64748b;

      animation:
        typing 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2){
      animation-delay:.15s;
    }

    .typing span:nth-child(3){
      animation-delay:.30s;
    }

    @keyframes typing{

      0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
      }

      30%{
        transform:translateY(-4px);
        opacity:1;
      }

    }

    /* =========================
       TOOLBAR
       ========================= */

    .toolbar{
      padding:14px;

      background:
        rgba(5,10,20,.72);

      border-top:
        1px solid rgba(255,255,255,.07);
    }

    .input-box{
  display:flex;

  align-items:center;

  gap:8px;

  padding:8px;

  background:#151b23;

  border:
    1px solid rgba(255,255,255,.09);

  border-radius:18px;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

    .input-box:focus-within{
  border-color:#19c37d;

  box-shadow:
    0 0 0 3px rgba(25,195,125,.08);
}

    input[type="text"]{
      flex:1;

      width:100%;

      min-height:42px;

      background:transparent;

      color:#fff;

      border:0;

      outline:none;

      padding:10px 8px;

      font-size:14px;
    }

    input[type="text"]::placeholder{
      color:#64748b;
    }

    .icon-btn{
      width:42px;
      height:42px;

      flex:0 0 42px;

      display:flex;

      align-items:center;

      justify-content:center;

      border:0;

      border-radius:13px;

      background:#111827;

      color:#cbd5e1;

      cursor:pointer;

      font-size:18px;

      transition:.2s ease;
    }

    .icon-btn:hover{
      background:#1e293b;

      color:#fff;

      transform:translateY(-1px);
    }
.plus-btn,
#micBtn{
  background:#151b23;
  color:#cbd5e1;
  border:1px solid rgba(255,255,255,.08);
}

.plus-btn:hover,
#micBtn:hover{
  background:#1d262f;
  color:#19c37d;
  border-color:rgba(25,195,125,.35);
}
    .send-btn{
  background:
    linear-gradient(
      135deg,
      #19c37d,
      #0f9f68
    );

  color:#fff;

  box-shadow:
    0 5px 18px rgba(25,195,125,.25);
}

    .send-btn:hover{
      filter:brightness(1.08);
    }

    .bottom-tools{
      display:flex;

      align-items:center;

      gap:7px;

      margin-top:9px;

      flex-wrap:wrap;
    }

    .tool-btn{
      display:flex;

      align-items:center;

      gap:6px;

      padding:8px 10px;

      border-radius:11px;

      border:1px solid rgba(255,255,255,.07);

      background:#0d1525;

      color:#94a3b8;

      font-size:11px;

      cursor:pointer;

      transition:.2s ease;
    }

    .tool-btn:hover{
      color:#fff;

      border-color:#38bdf8;

      background:#111d31;
    }

    .tool-btn:disabled{
      opacity:.35;

      cursor:not-allowed;
    }

    /* =========================
       PHOTO
       ========================= */

    .photo-area{
      display:none;
      margin-top:9px;

      padding:9px;

      border-radius:13px;

      background:#0a1020;

      border:1px solid rgba(255,255,255,.06);
    }

    input[type="file"]{
      width:100%;

      color:#94a3b8;

      font-size:11px;
    }
/* =========================
   MODERN TOOLS MENU
   ========================= */

.tools-panel{
  display:none;
  margin-top:10px;
  padding:10px;
  gap:8px;
  flex-wrap:wrap;
  background:rgba(10,16,32,.96);
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  box-shadow:0 12px 35px rgba(0,0,0,.25);
  animation:toolsIn .18s ease;
}

.tools-panel.show{
  display:flex;
}

.plus-btn{
  font-size:22px;
}

.plus-btn.active{
  background:#1e293b;
  color:#38bdf8;
  transform:rotate(45deg);
}

@keyframes toolsIn{
  from{
    opacity:0;
    transform:translateY(-6px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}


/* IL TUO CODICE RIMANE QUI */

.support{
  margin-top:10px;

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

  padding:9px 2px;

  color:#64748b;

  font-size:11px;
}
    /* =========================
       SUPPORT
       ========================= */

    .support{
      margin-top:10px;

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:10px;

      padding:9px 2px;

      color:#64748b;

      font-size:11px;
    }

    .paypal-btn{
      display:inline-flex;

      align-items:center;

      justify-content:center;

      padding:8px 11px;

      border-radius:10px;

      background:#0070ba;

      color:#fff;

      font-size:11px;

      font-weight:bold;

      text-decoration:none;

      transition:.2s ease;
    }

    .paypal-btn:hover{
      opacity:.9;

      transform:translateY(-1px);
    }

    /* =========================
       TOAST
       ========================= */

    .toast{
      position:fixed;

      left:50%;

      bottom:
        calc(25px + env(safe-area-inset-bottom));

      transform:
        translate(-50%,20px);

      padding:10px 15px;

      border-radius:12px;

      background:#111827;

      border:1px solid rgba(255,255,255,.1);

      color:#fff;

      font-size:12px;

      opacity:0;

      pointer-events:none;

      transition:.25s ease;

      z-index:100;
    }

    .toast.show{
      opacity:1;

      transform:translate(-50%,0);
    }
/* =========================
   MESSAGE ACTIONS
   ========================= */

.message-actions{
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;

  margin-top:8px;
  margin-left:42px;
}

.message-action{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  min-height:32px;

  padding:7px 10px;

  border-radius:10px;

  border:1px solid rgba(255,255,255,.08);

  background:#111827;

  color:#94a3b8;

  font-family:inherit;
  font-size:11px;
  line-height:1;

  cursor:pointer;

  -webkit-appearance:none;
  appearance:none;

  user-select:none;
  -webkit-user-select:none;

  touch-action:manipulation;

  transition:
    background .18s ease,
    border-color .18s ease,
    color .18s ease,
    transform .12s ease;
}

.message-action:hover{
  background:#1e293b;
  color:#fff;
  border-color:rgba(25,195,125,.35);
}

.message-action:active{
  transform:scale(.95);
}

.message-action.active{
  background:rgba(25,195,125,.16);
  color:#19c37d;
  border-color:rgba(25,195,125,.55);

  box-shadow:
    0 0 0 2px rgba(25,195,125,.06);
}
    /* =========================
       MOBILE
       ========================= */

    @media(max-width:600px){

      .top{
        padding-left:12px;
        padding-right:12px;
      }

      .logo{
        width:38px;
        height:38px;
        border-radius:12px;
      }

      .brand-title{
        font-size:15px;
      }

      .brand-subtitle{
        display:none;
      }

      .status{
        padding:6px 8px;
      }

      .wrap{
        padding:7px;
      }

      .card{
        border-radius:19px;
      }

      #messages{
        height:calc(100vh - 285px);
        min-height:360px;
        padding:15px 10px;
      }

      .message-line{
        max-width:96%;
      }

      .bubble{
        font-size:14px;
        padding:11px 13px;
      }

      .message-actions{
        margin-left:40px;
      }

      .message-action{
        padding:6px 8px;
        font-size:10px;
      }

      .support{
        flex-direction:column;
        align-items:flex-start;
      }

    }

  </style>

</head>

<body>

<div class="app">

  <!-- HEADER -->

<div class="top">

  <button
    class="menu-btn"
    type="button"
    onclick="toggleSideMenu()"
    aria-label="Menu"
  >
    ☰
  </button>

  <div class="brand">

    <div class="logo">
      🤖
    </div>

    <div class="brand-text">

      <div class="brand-title">
        Bob World
      </div>

    </div>

  </div>

  <div class="status">

    <span class="status-dot"></span>

    <span id="status">
      Online
    </span>

  </div>

</div>

  <!-- CONTENUTO -->

  <div class="wrap">

    <div class="card">

      <div id="messages"></div>


      <!-- TOOLBAR -->

      <div
  class="input-box"
  onclick="focusChatInput(event)"
>

  <button
    class="icon-btn plus-btn"
    id="plusBtn"
    type="button"
    onclick="toggleTools()"
    title="Altre funzioni"
  >
    ＋
  </button>

  <input
    id="input"
    type="text"
    placeholder="Scrivi a Bob..."
    autocomplete="off"
  />

  <button
    class="icon-btn"
    id="micBtn"
    onclick="startMic()"
    title="Microfono"
  >
    🎤
  </button>

  <button
    class="icon-btn send-btn"
    id="sendBtn"
    onclick="sendMessage()"
    title="Invia"
  >
    ➤
  </button>

</div>

<div
  class="tools-panel"
  id="toolsPanel"
>

  <button
    class="tool-btn"
    id="clearBtn"
    type="button"
  >
    🗑️ Pulisci
  </button>

  <button
    class="tool-btn"
    id="voiceToggle"
    onclick="toggleVoice()"
    type="button"
  >
    🔊 Voce ON
  </button>

 <button
  class="tool-btn"
  id="photoBtn"
  onclick="openPhotoPicker()"
  type="button"
>
  📸 Analizza foto
</button>

</div>

        


        <div class="photo-area">

          <input
            type="file"
            id="photo"
            accept="image/*"
          />

        </div>


        <div class="support">

          <span>
            Supporta ChatAI Bob ❤️
          </span>

          <a
            class="paypal-btn"
            href="https://www.paypal.me/bobbob1979"
            target="_blank"
            rel="noreferrer"
          >
            ❤️ Dona con PayPal
          </a>

        </div>

      </div>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

  // =====================================================
  // CONFIG
  // =====================================================

  const API =
    "https://chatai-bob-backend.onrender.com";


  const $ =
    (id) =>
      document.getElementById(id);


  // =====================================================
  // CLIENT ID
  // =====================================================

  const CLIENT_ID =
    (() => {

      let id =
        localStorage.getItem(
          "CLIENT_ID"
        );

      if (!id) {

        id =
          "web_" +
          Math.random()
            .toString(36)
            .slice(2);

        localStorage.setItem(
          "CLIENT_ID",
          id
        );

      }

      return id;

    })();


  // =====================================================
  // TOAST
  // =====================================================

  let toastTimer;

  function showToast(text){

    const toast =
      $("toast");

    toast.textContent =
      text;

    toast.classList.add(
      "show"
    );

    clearTimeout(
      toastTimer
    );

    toastTimer =
      setTimeout(
        () => {

          toast.classList.remove(
            "show"
          );

        },
        1800
      );

  }


  // =====================================================
  // CLEAN TEXT
  // =====================================================

  function cleanText(t){

    if (!t)
      return "";

    return String(t)

      .replace(/\*\*/g,"")
      .replace(/\*/g,"")
      .replace(/#/g,"")

      .replace(
        /^\s*[-•]\s+/gm,
        ""
      )

      .replace(
        /^\s*\d+[\.\)]\s+/gm,
        ""
      )

      .replace(
        /\n{3,}/g,
        "\n\n"
      )

      .trim();

  }
function toggleTools(){
  const panel = $("toolsPanel");
  const plus = $("plusBtn");

  if(!panel || !plus) return;

  panel.classList.toggle("show");

  plus.classList.toggle(
    "active",
    panel.classList.contains("show")
  );
}
function focusChatInput(event){

  if(event.target.closest("button")){
    return;
  }

  const input = $("input");

  if(input){
    input.focus();
  }
}
  // =====================================================
  // VOCE
  // =====================================================

  let VOICE_ON =
    true;


  function toggleVoice(){

    VOICE_ON =
      !VOICE_ON;

    $("voiceToggle").textContent =
      VOICE_ON
        ? "🔊 Voce ON"
        : "🔇 Voce OFF";

    if (!VOICE_ON){

      speechSynthesis.cancel();

    }

  }


  function speak(text){

    if (!VOICE_ON)
      return;

    if (!text)
      return;

    if (
      !(
        "speechSynthesis"
        in window
      )
    )
      return;

    const u =
      new SpeechSynthesisUtterance(
        text
      );

    u.lang =
      "it-IT";

    u.rate =
      1;

    speechSynthesis.cancel();

    speechSynthesis.speak(
      u
    );

  }


  // =====================================================
  // COPIA
  // =====================================================

  async function copyMessage(text){

    try{

      await navigator.clipboard.writeText(
        text
      );

      showToast(
        "📋 Risposta copiata"
      );

    }catch{

      showToast(
        "Impossibile copiare"
      );

    }

  }


  // =====================================================
  // CONDIVIDI
  // =====================================================

  async function shareMessage(text){

    try{

      if (
        navigator.share
      ){

        await navigator.share({

          title:
            "ChatAI Bob",

          text:
            text

        });

      }else{

        await navigator.clipboard.writeText(
          text
        );

        showToast(
          "🔗 Testo copiato per la condivisione"
        );

      }

    }catch(e){

      if (
        e &&
        e.name ===
          "AbortError"
      ){

        return;

      }

      showToast(
        "Condivisione non disponibile"
      );

    }

  }


  // =====================================================
// LIKE / DISLIKE
// =====================================================

function setLike(like, dislike){

  like.classList.add("active");
  dislike.classList.remove("active");

  showToast("❤️ Mi piace");
}


function setDislike(like, dislike){

  dislike.classList.add("active");
  like.classList.remove("active");

  showToast("👎 Feedback ricevuto");
}


  // =====================================================
  // UI MESSAGGI
  // =====================================================

  function add(
    role,
    text
  ){

    const d =
      document.createElement(
        "div"
      );

    d.className =
      "msg " +
      role;


    const line =
      document.createElement(
        "div"
      );

    line.className =
      "message-line";


    // AVATAR BOB

    if (
      role ===
      "ai"
    ){

      const avatar =
        document.createElement(
          "div"
        );

      avatar.className =
        "avatar";

      avatar.textContent =
        "🤖";

      line.appendChild(
        avatar
      );

    }


    // BOLLA

    const bubble =
      document.createElement(
        "div"
      );

    bubble.className =
      "bubble";

    bubble.textContent =
      text || "";


    line.appendChild(
      bubble
    );

    d.appendChild(
      line
    );


    // AZIONI SOTTO BOB

    if (
      role ===
      "ai"
    ){

      const actions =
        document.createElement(
          "div"
        );

      actions.className =
        "message-actions";


      // LIKE

      const like =
        document.createElement(
          "button"
        );

      like.className =
        "message-action";

      like.type =
        "button";

      like.textContent =
        "❤️ Mi piace";


      // DISLIKE

      const dislike =
        document.createElement(
          "button"
        );

      dislike.className =
        "message-action";

      dislike.type =
        "button";

      dislike.textContent =
        "👎 Non mi piace";


      // COPIA

      const copy =
        document.createElement(
          "button"
        );

      copy.className =
        "message-action";

      copy.type =
        "button";

      copy.textContent =
        "📋 Copia";


      // CONDIVIDI

      const share =
        document.createElement(
          "button"
        );

      share.className =
        "message-action";

      share.type =
        "button";

      share.textContent =
        "🔗 Condividi";


      like.onclick =
        () => {

          setLike(
            like,
            dislike
          );

        };


      dislike.onclick =
        () => {

          setDislike(
            like,
            dislike
          );

        };


      copy.onclick =
        () => {

          copyMessage(
            text || ""
          );

        };


      share.onclick =
        () => {

          shareMessage(
            text || ""
          );

        };


      actions.appendChild(
        like
      );

      actions.appendChild(
        dislike
      );

      actions.appendChild(
        copy
      );

      actions.appendChild(
        share
      );


      d.appendChild(
        actions
      );

    }


    $("messages")
      .appendChild(
        d
      );


    $("messages")
      .scrollTop =
      999999;

  async function checkBackend(){

    try{

          API +
          "/health",
          {
            cache:
              "no-store"
          }
        );


      const d =
        await r
          .json()
          .catch(
            () =>
              null
          );


      if (
        d &&
        d.status ===
          "ok"
      ){

        $("status")
          .textContent =
          "Online";

      }else{

        $("status")
          .textContent =
          "Offline";

      }

    catch{

      $("status")
        .textContent =
        "Offline";

    }

  }


  // =====================================================
  // FETCH SICURO
  // =====================================================

  async function fetchJsonOrThrow(
    url,
    options
  ){

    const res =
      await fetch(
        url,
        options
      );


    const raw =
      await res.text();


    let data =
      null;


    try{

      data =
        raw
          ? JSON.parse(raw)
          : null;

    }

    catch{

      data =
        null;

    }


    if (!res.ok){

      const msg =
        (
          data &&
          (
            data.detail ||
            data.error ||
            data.message
          )
        ) ||
        raw ||
        (
          "HTTP " +
          res.status
        );


      throw new Error(
        "HTTP " +
        res.status +
        " - " +
        msg
      );

    }


    return data;

  }

  async function sendMessage(){

    const input =

    const text =
      input.value.trim();


    if (!text)

    input.value =
      "";


    add(
      "user",
      text

    // TYPING

    const typing =
      document.createElement(
        "div"
      );

    typing.className =
      "msg ai";


    const typingLine =
      document.createElement(
        "div"
      );

    typingLine.className =
      "message-line";


    const avatar =

    const bubble =

    $("messages")
      .appendChild(

      );


    $("messages")
      .scrollTop =
      999999;


    $("sendBtn")
      .disabled =

    try{

      const d =
        await fetchJsonOrThrow(
          API +
          "/chat",
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body:
              JSON.stringify({

                message:
                  text,

                client_id:
                  CLIENT_ID

              })

          }
        );


      typing.remove();


      const outRaw =
        (
          d &&
          typeof d.text ===
            "string"
        )
          ? d.text
          : "";


      const out =
        cleanText(
          outRaw
        ) ||
        "Nessuna risposta.";


      add(
        "ai",
        out
      );


      speak(
        out
      );

    }

    catch(e){

      typing.remove();


      const errorText =

        (

          e.message
            ? e.message
            : "sconosciuto"
        );


      add(
        "ai",
        errorText

      speak(
        "Errore di risposta"
      );

    }

    finally{

      $("sendBtn")
        .disabled =
        false;

      $("input")
        .focus();

    }

  }


  // =====================================================

  function startMic(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition){

      alert(
        "Il microfono non è supportato su questo browser"
      );

      return;

    }


    const recognition =
      new SpeechRecognition();


    recognition.lang =
      "it-IT";


    recognition.interimResults =
      false;


    recognition.continuous =
      false;


    const mic =
      $("micBtn");


    mic.textContent =
      "🔴";


    recognition.onresult =
      function(event){

        const t =
          event
            .results[0][0]
            .transcript;


        $("input")
          .value =
          t;


        sendMessage();

      };


    recognition.onerror =
      function(){

        mic.textContent =
          "🎤";

      };


    recognition.onend =
      function(){

        mic.textContent =
          "🎤";

      };


    recognition.start();

  }
