<!DOCTYPE html>
<html lang="it">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>ChatAI Bob</title>

  <link rel="manifest" href="./manifest.json">

  <meta
    name="theme-color"
    content="#070b14"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <style>

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      padding:0;
      width:100%;
      height:100%;
    }

    body{
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #111c35 0%,
          #070b14 45%,
          #05070d 100%
        );

      color:#f1f5f9;
    }

    button,
    input{
      font-family:inherit;
    }

    button{
      -webkit-tap-highlight-color:transparent;
    }

    /* =========================
       APP
       ========================= */

    .app{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    /* =========================
       HEADER
       ========================= */

    .top{
      position:sticky;
      top:0;
      z-index:50;

      width:100%;

      padding:
        calc(12px + env(safe-area-inset-top))
        16px
        12px;

      display:flex;
      align-items:center;
      gap:12px;

      background:rgba(11,15,20,.92);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      border-bottom:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        0 8px 30px rgba(0,0,0,.25);
    }

    .menu-btn{
      position:relative;
      z-index:300;

      width:40px;
      height:40px;

      flex:0 0 40px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:12px;

      background:#151b23;
      color:#f4f7fb;

      font-size:22px;

      cursor:pointer;

      pointer-events:auto;
      touch-action:manipulation;

      transition:
        background .2s ease,
        transform .2s ease;
    }

    .menu-btn:hover{
      background:#1d262f;
    }

    .menu-btn:active{
      transform:scale(.94);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;

      min-width:0;
    }

    .logo{
      width:42px;
      height:42px;

      flex:0 0 42px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:14px;

      background:
        linear-gradient(
          135deg,
          #19c37d,
          #0f9f68
        );

      font-size:22px;

      box-shadow:
        0 6px 20px rgba(25,195,125,.25);
    }

    .brand-text{
      display:flex;
      flex-direction:column;
      gap:2px;

      min-width:0;
    }

    .brand-title{
      font-size:16px;
      font-weight:800;
      letter-spacing:.2px;

      white-space:nowrap;
    }

    .status{
      margin-left:auto;

      display:flex;
      align-items:center;
      gap:7px;

      padding:7px 10px;

      border-radius:999px;

      background:rgba(15,23,42,.85);

      border:
        1px solid rgba(255,255,255,.08);

      font-size:11px;
      color:#cbd5e1;

      white-space:nowrap;
    }

    .status-dot{
      width:7px;
      height:7px;

      flex:0 0 7px;

      border-radius:50%;

      background:#22c55e;

      box-shadow:
        0 0 10px rgba(34,197,94,.8);
    }

    /* =========================
       SIDE MENU
       ========================= */

    .side-menu{
      position:fixed;

      top:0;
      left:0;

      z-index:200;

      width:290px;
      max-width:85vw;
      height:100vh;

      padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(18px + env(safe-area-inset-bottom));

      background:#0b111c;

      border-right:
        1px solid rgba(255,255,255,.08);

      box-shadow:
        15px 0 45px rgba(0,0,0,.40);

      transform:translateX(-105%);

      transition:
        transform .25s ease;

      overflow-y:auto;
    }

    .side-menu.show{
      transform:translateX(0);
    }

    .side-menu-header{
      display:flex;
      align-items:center;
      justify-content:space-between;

      margin-bottom:18px;
    }

    .side-menu-title{
      font-size:17px;
      font-weight:800;
    }

    .close-menu{
      width:38px;
      height:38px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:11px;

      background:#151b23;
      color:#fff;

      font-size:20px;

      cursor:pointer;
    }

    .new-chat-btn{
      width:100%;

      padding:11px 13px;

      border:
        1px solid rgba(25,195,125,.35);

      border-radius:12px;

      background:
        rgba(25,195,125,.12);

      color:#19c37d;

      font-size:13px;
      font-weight:700;

      cursor:pointer;

      margin-bottom:15px;
    }

    .new-chat-btn:hover{
      background:
        rgba(25,195,125,.20);
    }

    .conversations-title{
      margin:8px 4px;

      color:#64748b;

      font-size:11px;

      text-transform:uppercase;

      letter-spacing:.5px;
    }

    .conversation-list{
      display:flex;
      flex-direction:column;
      gap:6px;
    }

    .conversation-item{
      display:flex;
      align-items:center;
      gap:8px;

      width:100%;

      padding:10px;

      border:
        1px solid transparent;

      border-radius:11px;

      background:transparent;

      color:#cbd5e1;

      cursor:pointer;

      text-align:left;
    }

    .conversation-item:hover{
      background:#151b23;
    }

    .conversation-item.active{
      background:#17231f;

      border-color:
        rgba(25,195,125,.25);
    }

    .conversation-name{
      flex:1;

      overflow:hidden;

      white-space:nowrap;

      text-overflow:ellipsis;

      font-size:12px;
    }

    .delete-conversation{
      flex:0 0 auto;

      width:28px;
      height:28px;

      display:flex;
      align-items:center;
      justify-content:center;

      border:0;

      border-radius:8px;

      background:transparent;

      color:#64748b;

      cursor:pointer;

      font-size:14px;
    }

    .delete-conversation:hover{
      color:#ef4444;
      background:rgba(239,68,68,.08);
    }

    .empty-conversations{
      padding:12px 5px;

      color:#64748b;

      font-size:12px;
    }

    .menu-overlay{
      display:none;

      position:fixed;

      inset:0;

      z-index:150;

      background:
        rgba(0,0,0,.48);
    }

    .menu-overlay.show{
      display:block;
    }

    /* =========================
       BOB WORLD MENU
       ========================= */

    .menu-section-title{
      margin:18px 4px 9px;
      padding-left:6px;

      color:#8b9cff;

      font-size:11px;
      font-weight:800;

      text-transform:uppercase;
      letter-spacing:1px;
    }

    .menu-item{
      width:100%;
      min-height:48px;

      display:flex;
      align-items:center;

      gap:12px;

      padding:10px 12px;
      margin:5px 0;

      border:
        1px solid rgba(255,255,255,.06);

      border-radius:13px;

      background:
        linear-gradient(
          135deg,
          rgba(30,41,59,.55),
          rgba(15,23,42,.45)
        );

      color:#dbeafe;

      font-family:inherit;
      font-size:13px;
      font-weight:600;

      text-align:left;
      text-decoration:none;

      cursor:pointer;

      box-shadow:
        0 4px 14px rgba(0,0,0,.16);

      transition:
        transform .18s ease,
        background .18s ease,
        border-color .18s ease,
        box-shadow .18s ease,
        color .18s ease;
    }

    .menu-item:hover{
      background:
        linear-gradient(
          135deg,
          rgba(59,130,246,.18),
          rgba(139,92,246,.16)
        );

      border-color:
        rgba(99,102,241,.35);

      color:#ffffff;

      box-shadow:
        0 6px 20px rgba(59,130,246,.12);
    }

    .menu-item:active{
      transform:scale(.97);
    }

    .menu-item-icon{
      width:30px;
      height:30px;

      flex:0 0 30px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:9px;

      background:
        rgba(59,130,246,.12);

      font-size:17px;

      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.04);
    }

    .menu-support{
      color:#fda4af;

      background:
        linear-gradient(
          135deg,
          rgba(244,63,94,.10),
          rgba(190,24,93,.08)
        );
    }

    .menu-support:hover{
      color:#fff;

      background:
        linear-gradient(
          135deg,
          rgba(244,63,94,.20),
          rgba(190,24,93,.16)
        );

      border-color:
        rgba(244,63,94,.30);

      box-shadow:
        0 6px 20px rgba(244,63,94,.12);
    }

    .menu-divider{
      height:1px;

      margin:
        16px 5px 10px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(148,163,184,.18),
          transparent
        );
    }

    /* =========================
       MAIN
       ========================= */

    .wrap{
      width:100%;
      max-width:920px;

      margin:0 auto;

      padding:
        14px
        14px
        calc(14px + env(safe-area-inset-bottom));
    }

    .card{
      width:100%;

      background:
        rgba(8,14,27,.82);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:24px;

      overflow:hidden;

      box-shadow:
        0 20px 60px rgba(0,0,0,.28);
    }

    /* =========================
       MESSAGES
       ========================= */

    #messages{
      height:
        calc(100vh - 280px);

      min-height:400px;

      overflow-y:auto;

      padding:20px 16px;

      scroll-behavior:smooth;
    }

    #messages::-webkit-scrollbar{
      width:5px;
    }

    #messages::-webkit-scrollbar-thumb{
      background:#263247;
      border-radius:999px;
    }

    .msg{
      width:100%;

      margin:16px 0;

      display:flex;
      flex-direction:column;
    }

    .msg.user{
      align-items:flex-end;
    }

    .message-line{
      width:100%;

      display:flex;
      align-items:flex-start;

      gap:10px;

      max-width:100%;
    }

    .msg.user .message-line{
      justify-content:flex-end;
    }

    .bubble{
      max-width:
        min(78%, 680px);

      padding:
        12px 14px;

      border-radius:16px;

      background:#111827;

      border:
        1px solid rgba(255,255,255,.07);

      color:#e5e7eb;

      font-size:14px;

      line-height:1.55;

      white-space:pre-wrap;

      overflow-wrap:anywhere;

      box-shadow:
        0 5px 18px rgba(0,0,0,.12);
    }

    .msg.ai .bubble{
      border-top-left-radius:6px;
    }

    .msg.user .bubble{
      background:
        linear-gradient(
          135deg,
          #19c37d,
          #0f9f68
        );

      color:#fff;

      border:0;

      border-top-right-radius:6px;
    }

    .avatar{
      flex:0 0 32px;

      width:32px;
      height:32px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:11px;

      background:
        linear-gradient(
          135deg,
          #19c37d,
          #0f9f68
        );

      font-size:16px;

      box-shadow:
        0 5px 18px rgba(25,195,125,.20);
    }

    /* =========================
       MESSAGE ACTIONS
       ========================= */

    .message-actions{
      display:flex;

      align-items:center;

      gap:6px;

      flex-wrap:wrap;

      margin-top:8px;

      margin-left:42px;
    }

    .message-action{
      display:inline-flex;

      align-items:center;
      justify-content:center;

      min-height:32px;

      padding:7px 10px;

      border-radius:10px;

      border:
        1px solid rgba(255,255,255,.08);

      background:#111827;

      color:#94a3b8;

      font-size:11px;

      line-height:1;

      cursor:pointer;

      -webkit-appearance:none;
      appearance:none;

      user-select:none;
      -webkit-user-select:none;

      touch-action:manipulation;

      transition:
        background .18s ease,
        border-color .18s ease,
        color .18s ease,
        transform .12s ease;
    }

    .message-action:hover{
      background:#1e293b;

      color:#fff;

      border-color:
        rgba(25,195,125,.35);
    }

    .message-action:active{
      transform:scale(.95);
    }

    .message-action.active{
      background:
        rgba(25,195,125,.16);

      color:#19c37d;

      border-color:
        rgba(25,195,125,.55);

      box-shadow:
        0 0 0 2px
        rgba(25,195,125,.06);
    }

    /* =========================
       TYPING
       ========================= */

    .typing{
      display:flex;

      align-items:center;

      gap:5px;
    }

    .typing span{
      width:6px;
      height:6px;

      border-radius:50%;

      background:#64748b;

      animation:
        typing 1.2s
        infinite
        ease-in-out;
    }

    .typing span:nth-child(2){
      animation-delay:.15s;
    }

    .typing span:nth-child(3){
      animation-delay:.30s;
    }

    @keyframes typing{

      0%,60%,100%{
        transform:translateY(0);
        opacity:.35;
      }

      30%{
        transform:translateY(-4px);
        opacity:1;
      }

    }

    /* =========================
       TOOLBAR
       ========================= */

    .input-box{
      display:flex;

      align-items:center;

      gap:8px;

      padding:8px;

      background:#151b23;

      border:
        1px solid rgba(255,255,255,.09);

      border-radius:18px;

      transition:
        border-color .2s ease,
        box-shadow .2s ease;
    }

    .input-box:focus-within{
      border-color:#19c37d;

      box-shadow:
        0 0 0 3px
        rgba(25,195,125,.08);
    }

    input[type="text"]{
      flex:1;

      width:100%;

      min-height:42px;

      background:transparent;

      color:#fff;

      border:0;

      outline:none;

      padding:10px 8px;

      font-size:14px;
    }

    input[type="text"]::placeholder{
      color:#64748b;
    }

    .icon-btn{
      width:42px;
      height:42px;

      flex:0 0 42px;

      display:flex;

      align-items:center;
      justify-content:center;

      border:0;

      border-radius:13px;

      background:#111827;

      color:#cbd5e1;

      cursor:pointer;

      font-size:18px;

      transition:.2s ease;
    }

    .icon-btn:hover{
      background:#1e293b;

      color:#fff;

      transform:translateY(-1px);
    }

    .icon-btn:disabled{
      opacity:.45;

      cursor:not-allowed;

      transform:none;
    }

    .plus-btn,
    #micBtn{
      background:#151b23;

      color:#cbd5e1;

      border:
        1px solid rgba(255,255,255,.08);
    }

    .plus-btn:hover,
    #micBtn:hover{
      background:#1d262f;

      color:#19c37d;

      border-color:
        rgba(25,195,125,.35);
    }

    .plus-btn{
      font-size:22px;
    }

    .plus-btn.active{
      background:#1e293b;

      color:#38bdf8;

      transform:rotate(45deg);
    }

    .send-btn{
      background:
        linear-gradient(
          135deg,
          #19c37d,
          #0f9f68
        );

      color:#fff;

      box-shadow:
        0 5px 18px
        rgba(25,195,125,.25);
    }

    .send-btn:hover{
      filter:brightness(1.08);
    }

    .tools-panel{
      display:none;

      margin-top:10px;

      padding:10px;

      gap:8px;

      flex-wrap:wrap;

      background:
        rgba(10,16,32,.96);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:16px;

      box-shadow:
        0 12px 35px rgba(0,0,0,.25);

      animation:
        toolsIn .18s ease;
    }

    .tools-panel.show{
      display:flex;
    }

    @keyframes toolsIn{

      from{
        opacity:0;
        transform:translateY(-6px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    .tool-btn{
      display:flex;

      align-items:center;

      gap:6px;

      padding:8px 10px;

      border-radius:11px;

      border:
        1px solid rgba(255,255,255,.07);

      background:#0d1525;

      color:#94a3b8;

      font-size:11px;

      cursor:pointer;

      transition:.2s ease;
    }

    .tool-btn:hover{
      color:#fff;

      border-color:#38bdf8;

      background:#111d31;
    }

    .tool-btn:disabled{
      opacity:.35;

      cursor:not-allowed;
    }

    /* =========================
       PHOTO
       ========================= */

    .photo-area{
      display:none;
    }

    #photo{
      display:none;
    }

    /* =========================
       SUPPORT
       ========================= */

    .support{
      margin-top:10px;

      display:flex;

      justify-content:space-between;

      align-items:center;

      gap:10px;

      padding:9px 2px;

      color:#64748b;

      font-size:11px;
    }

    .paypal-btn{
      display:inline-flex;

      align-items:center;

      justify-content:center;

      padding:8px 11px;

      border-radius:10px;

      background:#0070ba;

      color:#fff;

      font-size:11px;

      font-weight:bold;

      text-decoration:none;

      transition:.2s ease;
    }

    .paypal-btn:hover{
      opacity:.9;

      transform:translateY(-1px);
    }

    /* =========================
       TOAST
       ========================= */

    .toast{
      position:fixed;

      left:50%;

      bottom:
        calc(25px + env(safe-area-inset-bottom));

      transform:
        translate(-50%,20px);

      padding:10px 15px;

      border-radius:12px;

      background:#111827;

      border:
        1px solid rgba(255,255,255,.1);

      color:#fff;

      font-size:12px;

      opacity:0;

      pointer-events:none;

      transition:.25s ease;

      z-index:500;
    }

    .toast.show{
      opacity:1;

      transform:
        translate(-50%,0);
    }

    /* =========================
       BOB CREDITS MODAL
       ========================= */

    .credits-modal{
      position:fixed;

      inset:0;

      z-index:9999;

      display:flex;

      align-items:center;
      justify-content:center;

      padding:20px;

      background:
        rgba(0,0,0,.68);

      backdrop-filter:blur(8px);
      -webkit-backdrop-filter:blur(8px);
    }

    .credits-box{
      width:100%;
      max-width:390px;

      padding:22px;

      border:
        1px solid rgba(255,255,255,.10);

      border-radius:22px;

      background:
        linear-gradient(
          145deg,
          #111827,
          #0b1220
        );

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);

      color:#fff;

      animation:
        creditsIn .20s ease;
    }

    @keyframes creditsIn{

      from{
        opacity:0;
        transform:
          translateY(10px)
          scale(.97);
      }

      to{
        opacity:1;
        transform:
          translateY(0)
          scale(1);
      }

    }

    .credits-header{
      display:flex;

      align-items:center;
      justify-content:space-between;

      margin-bottom:20px;
    }

    .credits-title{
      font-size:20px;
      font-weight:800;
    }

    .credits-close{
      width:36px;
      height:36px;

      display:flex;

      align-items:center;
      justify-content:center;

      border:0;

      border-radius:10px;

      background:
        rgba(255,255,255,.07);

      color:#cbd5e1;

      font-size:22px;

      cursor:pointer;
    }

    .credits-close:hover{
      background:
        rgba(255,255,255,.12);

      color:#fff;
    }

    .credits-balance{
      padding:22px;

      border-radius:18px;

      text-align:center;

      background:
        linear-gradient(
          135deg,
          rgba(59,130,246,.18),
          rgba(139,92,246,.18)
        );

      border:
        1px solid rgba(99,102,241,.25);
    }

    .credits-balance-label{
      color:#94a3b8;

      font-size:12px;

      margin-bottom:6px;
    }

    .credits-number{
      font-size:42px;

      font-weight:900;

      background:
        linear-gradient(
          90deg,
          #60a5fa,
          #a78bfa
        );

      -webkit-background-clip:text;
      background-clip:text;

      color:transparent;
    }

    .credits-unit{
      color:#cbd5e1;

      font-size:13px;

      margin-top:2px;
    }

    .credits-info{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:10px;

      margin-top:14px;
    }

    .credits-stat{
      padding:12px;

      border-radius:12px;

      background:
        rgba(255,255,255,.05);

      text-align:center;
    }

    .credits-stat strong{
      display:block;

      font-size:18px;

      color:#e2e8f0;
    }

    .credits-stat span{
      color:#64748b;

      font-size:11px;
    }

    .credits-actions{
      margin-top:18px;
    }

    .credits-action{
      width:100%;

      min-height:46px;

      margin-top:9px;

      border:
        1px solid rgba(255,255,255,.08);

      border-radius:12px;

      background:
        rgba(255,255,255,.05);

      color:#e2e8f0;

  <script>

    // =====================================================
    // CONFIG
    // =====================================================

    const API =
      "https://chatai-bob-backend.onrender.com";


    const $ =
      (id) =>
        document.getElementById(id);


    // =====================================================
    // CLIENT ID BASE
    // =====================================================

    let BASE_CLIENT_ID =
      localStorage.getItem(
        "CLIENT_ID"
      );


    if(!BASE_CLIENT_ID){

      BASE_CLIENT_ID =
        "web_" +
        Math.random()
          .toString(36)
          .slice(2) +
        Date.now().toString(36);


      localStorage.setItem(
        "CLIENT_ID",
        BASE_CLIENT_ID
      );

    }


    // =====================================================
    // CRONOLOGIA CONVERSAZIONI
    // =====================================================

    const STORAGE_KEY =
      "bob_conversations_" +
      BASE_CLIENT_ID;


    const ACTIVE_CHAT_KEY =
      "bob_active_conversation_" +
      BASE_CLIENT_ID;


    let conversations = [];


    try{

      conversations =
        JSON.parse(
          localStorage.getItem(
            STORAGE_KEY
          ) || "[]"
        );


      if(
        !Array.isArray(
          conversations
        )
      ){

        conversations = [];

      }

    }catch{

      conversations = [];

    }


    let activeConversationId =
      localStorage.getItem(
        ACTIVE_CHAT_KEY
      );


    function saveConversations(){

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
          conversations
        )
      );

    }


    function createConversation(){

      const conversation = {

        id:
          "chat_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2,8),

        clientId:
          BASE_CLIENT_ID +
          "_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2,6),

        title:
          "Nuova chat",

        messages:[],

        createdAt:
          Date.now(),

        updatedAt:
          Date.now()

      };


      conversations.unshift(
        conversation
      );


      activeConversationId =
        conversation.id;


      localStorage.setItem(
        ACTIVE_CHAT_KEY,
        activeConversationId
      );


      saveConversations();


      return conversation;

    }


    function getActiveConversation(){

      return conversations.find(
        conversation =>
          conversation.id ===
          activeConversationId
      );

    }


    function ensureConversation(){

      let conversation =
        getActiveConversation();


      if(!conversation){

        conversation =
          createConversation();

      }


      return conversation;

    }


    function getActiveClientId(){

      const conversation =
        getActiveConversation();


      if(
        conversation &&
        conversation.clientId
      ){

        return conversation.clientId;

      }


      return BASE_CLIENT_ID;

    }


    function saveMessage(
      role,
      text
    ){

      const conversation =
        ensureConversation();


      conversation.messages.push({

        role:
          role,

        text:
          text || "",

        time:
          Date.now()

      });


      if(
        role === "user" &&
        conversation.title ===
          "Nuova chat"
      ){

        const cleanTitle =
          String(
            text || ""
          )
          .trim()
          .replace(
            /\s+/g,
            " "
          );


        conversation.title =
          cleanTitle
            ? cleanTitle.slice(
                0,
                40
              )
            : "Nuova chat";

      }


      conversation.updatedAt =
        Date.now();


      saveConversations();


      renderConversationList();

    }


    function loadConversation(
      id
    ){

      const conversation =
        conversations.find(
          item =>
            item.id === id
        );


      if(!conversation)
        return;


      activeConversationId =
        conversation.id;


      localStorage.setItem(
        ACTIVE_CHAT_KEY,
        activeConversationId
      );


      $("messages").innerHTML =
        "";


      if(
        conversation.messages.length ===
        0
      ){

        add(
          "ai",
          "Ciao 👋 Sono Bob. Come posso aiutarti?",
          false
        );

      }else{

        conversation.messages.forEach(
          message => {

            add(
              message.role,
              message.text,
              false
            );

          }
        );

      }


      renderConversationList();

      closeSideMenu();

      $("input").focus();

    }


    function newConversation(){

      createConversation();


      $("messages").innerHTML =
        "";


      add(
        "ai",
        "Ciao 👋 Sono Bob. Come posso aiutarti?",
        true
      );


      renderConversationList();

      closeSideMenu();

      $("input").focus();


      showToast(
        "✨ Nuova chat"
      );

    }


    function deleteConversation(
      event,
      id
    ){

      if(event){
        event.stopPropagation();
      }


      const conversation =
        conversations.find(
          item =>
            item.id === id
        );


      if(!conversation)
        return;


      conversations =
        conversations.filter(
          item =>
            item.id !== id
        );


      if(
        activeConversationId === id
      ){

        activeConversationId =
          null;


        localStorage.removeItem(
          ACTIVE_CHAT_KEY
        );


        $("messages").innerHTML =
          "";


        createConversation();


        add(
          "ai",
          "Ciao 👋 Sono Bob. Come posso aiutarti?",
          true
        );

      }


      saveConversations();

      renderConversationList();


      showToast(
        "🗑️ Chat eliminata"
      );

    }


    function renderConversationList(){

      const list =
        $("conversationList");


      if(!list)
        return;


      list.innerHTML =
        "";


      conversations.sort(
        (a,b) =>
          (b.updatedAt || 0) -
          (a.updatedAt || 0)
      );


      if(
        conversations.length ===
        0
      ){

        const empty =
          document.createElement(
            "div"
          );


        empty.className =
          "empty-conversations";


        empty.textContent =
          "Nessuna conversazione";


        list.appendChild(
          empty
        );


        return;

      }


      conversations.forEach(
        conversation => {

          const item =
            document.createElement(
              "div"
            );


          item.className =
            "conversation-item" +
            (
              conversation.id ===
              activeConversationId
                ? " active"
                : ""
            );


          item.onclick =
            () =>
              loadConversation(
                conversation.id
              );


          const name =
            document.createElement(
              "div"
            );


          name.className =
            "conversation-name";


          name.textContent =
            conversation.title ||
            "Nuova chat";


          const del =
            document.createElement(
              "button"
            );


          del.className =
            "delete-conversation";


          del.type =
            "button";


          del.textContent =
            "🗑️";


          del.title =
            "Elimina conversazione";


          del.setAttribute(
            "aria-label",
            "Elimina conversazione"
          );


          del.onclick =
            event =>
              deleteConversation(
                event,
                conversation.id
              );


          item.appendChild(
            name
          );


          item.appendChild(
            del
          );


          list.appendChild(
            item
          );

        }
      );

    }


    // =====================================================
    // MENU
    // =====================================================

    function toggleSideMenu(){

      const menu =
        $("sideMenu");


      const overlay =
        $("menuOverlay");


      if(!menu || !overlay)
        return;


      menu.classList.toggle(
        "show"
      );


      overlay.classList.toggle(
        "show"
      );

    }


    function closeSideMenu(){

      const menu =
        $("sideMenu");


      const overlay =
        $("menuOverlay");


      if(menu){

        menu.classList.remove(
          "show"
        );

      }


      if(overlay){

        overlay.classList.remove(
          "show"
        );

      }

    }


    // =====================================================
    // BOB WORLD - SEZIONI MENU
    // =====================================================

    function openBobSection(section){

      closeSideMenu();


      if(section === "images"){

        showToast(
          "🖼️ Le mie immagini"
        );


        add(
          "ai",
          "🖼️ Le mie immagini\n\nLa galleria delle immagini di Bob sarà disponibile qui."
        );


        return;

      }


      if(section === "files"){

        showToast(
          "📁 I miei file"
        );


        add(
          "ai",
          "📁 I miei file\n\nLa gestione dei tuoi file sarà disponibile qui."
        );


        return;

      }


      if(section === "videos"){

        showToast(
          "🎬 I miei video"
        );


        add(
          "ai",
          "🎬 I miei video\n\nLa sezione video di Bob sarà disponibile qui."
        );


        return;

      }


      if(section === "credits"){

        openCreditsPanel();


        return;

      }


      if(section === "settings"){

        showToast(
          "⚙️ Impostazioni"
        );


        add(
          "ai",
          "⚙️ Impostazioni\n\nLe impostazioni di Bob saranno disponibili qui."
        );


        return;

      }

    }


    // =====================================================
    // BOB CREDITS
    // =====================================================

    const CREDITS_KEY =
      "bob_world_credits";


    const CREDITS_USED_KEY =
      "bob_world_credits_used";


    function getBobCredits(){

      const saved =
        localStorage.getItem(
          CREDITS_KEY
        );


      if(saved === null){

        localStorage.setItem(
          CREDITS_KEY,
          "100"
        );


        return 100;

      }


      const value =
        Number(
          saved
        );


      return Number.isFinite(
        value
      )
        ? Math.max(
            0,
            value
          )
        : 0;

    }


    function getBobCreditsUsed(){

      const saved =
        localStorage.getItem(
          CREDITS_USED_KEY
        );


      const value =
        Number(
          saved || 0
        );


      return Number.isFinite(
        value
      )
        ? Math.max(
            0,
            value
          )
        : 0;

    }


    function saveBobCredits(
      value
    ){

      const safeValue =
        Math.max(
          0,
          Math.floor(
            Number(value) || 0
          )
        );


      localStorage.setItem(
        CREDITS_KEY,
        String(
          safeValue
        )
      );


      return safeValue;

    }


    function addBobCredits(
      amount
    ){

      const current =
        getBobCredits();


      const safeAmount =
        Math.max(
          0,
          Math.floor(
            Number(amount) || 0
          )
        );


      return saveBobCredits(
        current +
        safeAmount
      );

    }


    function useBobCredits(
      amount
    ){

      const safeAmount =
        Math.max(
          0,
          Math.floor(
            Number(amount) || 0
          )
        );


      const current =
        getBobCredits();


      if(
        current <
        safeAmount
      ){

        showToast(
          "💎 Crediti insufficienti"
        );


        return false;

      }


      saveBobCredits(
        current -
        safeAmount
      );


      const used =
        getBobCreditsUsed();


      localStorage.setItem(
        CREDITS_USED_KEY,
        String(
          used +
          safeAmount
        )
      );


      return true;

    }


    function openCreditsPanel(){

      const old =
        document.getElementById(
          "creditsModal"
        );


      if(old){

        old.remove();

      }


      const credits =
        getBobCredits();


      const used =
        getBobCreditsUsed();


      const modal =
        document.createElement(
          "div"
        );


      modal.className =
        "credits-modal";


      modal.id =
        "creditsModal";


      modal.innerHTML = `

        <div class="credits-box">

          <div class="credits-header">

            <div class="credits-title">
              💎 I miei crediti
            </div>

            <button
              class="credits-close"
              type="button"
              onclick="closeCreditsPanel()"
              aria-label="Chiudi"
            >
              ×
            </button>

          </div>


          <div class="credits-balance">

            <div class="credits-balance-label">
              Crediti disponibili
            </div>


            <div
              class="credits-number"
              id="creditsNumber"
            >
              ${credits}
            </div>


            <div class="credits-unit">
              BOB Credits
            </div>

          </div>


          <div class="credits-info">

            <div class="credits-stat">

              <strong id="creditsUsed">
                ${used}
              </strong>

              <span>
                Utilizzati
              </span>

            </div>


            <div class="credits-stat">

              <strong>
                100
              </strong>

              <span>
                Crediti iniziali
              </span>

            </div>

          </div>


          <div class="credits-actions">

            <button
              class="credits-action"
              type="button"
              onclick="showToast('💳 Acquisto crediti: in preparazione')"
            >
              💳 Acquista crediti
            </button>


            <button
              class="credits-action"
              type="button"
              onclick="showToast('🤖 I crediti saranno usati per le funzioni AI')"
            >
              🤖 Come usare i crediti
            </button>

          </div>


          <div class="credits-note">

            Hai 100 crediti iniziali.
            Per ora vengono salvati localmente
            su questo dispositivo.
            Il sistema di pagamento e il saldo
            online verranno collegati in seguito.

          </div>

        </div>

      `;


      modal.addEventListener(
        "click",
        function(event){

          if(
            event.target ===
            modal
          ){

            closeCreditsPanel();

          }

        }
      );


      document.body.appendChild(
        modal
      );

    }


    function closeCreditsPanel(){

      const modal =
        document.getElementById(
          "creditsModal"
        );


      if(modal){

        modal.remove();

      }

    }


    // =====================================================
    // TOAST
    // =====================================================

    let toastTimer;


    function showToast(
      text
    ){

      const toast =
        $("toast");


      if(!toast)
        return;


      toast.textContent =
        text;


      toast.classList.add(
        "show"
      );


      clearTimeout(
        toastTimer
      );


      toastTimer =
        setTimeout(
          () => {

            toast.classList.remove(
              "show"
            );

          },
          1800
        );

    }


    // =====================================================
    // TOOLS
    // =====================================================

    function toggleTools(){

      const panel =
        $("toolsPanel");


      const plus =
        $("plusBtn");


      if(!panel || !plus)
        return;


      panel.classList.toggle(
        "show"
      );


      plus.classList.toggle(
        "active",
        panel.classList.contains(
          "show"
        )
      );

    }


    function closeTools(){

      const panel =
        $("toolsPanel");


      const plus =
        $("plusBtn");


      if(panel){

        panel.classList.remove(
          "show"
        );

      }


      if(plus){

        plus.classList.remove(
          "active"
        );

      }

    }


    function focusChatInput(
      event
    ){

      if(
        event &&
        event.target &&
        event.target.closest &&
        event.target.closest(
          "button"
        )
      ){

        return;

      }


      const input =
        $("input");


      if(input){

        input.focus();

      }

    }


    // =====================================================
    // CLEAN TEXT
    // =====================================================

    function cleanText(
      t
    ){

      if(!t)
        return "";


      return String(t)

        .replace(
          /\*\*/g,
          ""
        )

        .replace(
          /\*/g,
          ""
        )

        .replace(
          /#/g,
          ""
        )

        .replace(
          /^\s*[-•]\s+/gm,
          ""
        )

        .replace(
          /^\s*\d+[\.\)]\s+/gm,
          ""
        )

        .replace(
          /\n{3,}/g,
          "\n\n"
        )

        .trim();

    }


    // =====================================================
    // VOCE
    // =====================================================

    let VOICE_ON =
      true;


    function toggleVoice(){

      VOICE_ON =
        !VOICE_ON;


      const voiceButton =
        $("voiceToggle");


      if(voiceButton){

        voiceButton.textContent =
          VOICE_ON
            ? "🔊 Voce ON"
            : "🔇 Voce OFF";

      }


      if(!VOICE_ON){

        if(
          "speechSynthesis"
          in window
        ){

          speechSynthesis.cancel();

        }

      }


      showToast(
        VOICE_ON
          ? "🔊 Voce attivata"
          : "🔇 Voce disattivata"
      );

    }


    function speak(
      text
    ){

      if(!VOICE_ON)
        return;


      if(!text)
        return;


      if(
        !(
          "speechSynthesis"
          in window
        )
      )
        return;


      const u =
        new SpeechSynthesisUtterance(
          text
        );


      u.lang =
        "it-IT";


      u.rate =
        1;


      speechSynthesis.cancel();


      speechSynthesis.speak(
        u
      );

    }


    // =====================================================
    // COPIA
    // =====================================================

    async function copyMessage(
      text
    ){

      try{

        if(
          navigator.clipboard &&
          navigator.clipboard.writeText
        ){

          await navigator.clipboard.writeText(
            text
          );

        }else{

          const area =
            document.createElement(
              "textarea"
            );


          area.value =
            text;


          area.style.position =
            "fixed";


          area.style.opacity =
            "0";


          document.body.appendChild(
            area
          );


          area.select();


          document.execCommand(
            "copy"
          );


          area.remove();

        }


        showToast(
          "📋 Risposta copiata"
        );

      }catch{

        showToast(
          "Impossibile copiare"
        );

      }

    }


    // =====================================================
    // CONDIVIDI
    // =====================================================

    async function shareMessage(
      text
    ){

      try{

        if(
          navigator.share
        ){

          await navigator.share({

            title:
              "ChatAI Bob",

            text:
              text

          });

        }else{

          await copyMessage(
            text
          );


          showToast(
            "🔗 Testo copiato per la condivisione"
          );

        }

      }catch(e){

        if(
          e &&
          e.name ===
            "AbortError"
        ){

          return;

        }


        showToast(
          "Condivisione non disponibile"
        );

      }

    }

    // UI MESSAGGI

        like.type =
          "button";


        like.textContent =
          "❤️ Mi piace";


        const dislike =
          document.createElement(
            "button"
          );


        dislike.className =
          "message-action";


        dislike.type =
          "button";


        dislike.textContent =
          "👎 Non mi piace";


        const copy =
          document.createElement(
            "button"
          );


        copy.className =
          "message-action";


        copy.type =
          "button";


        copy.textContent =

        const share =
          document.createElement(
            "button"
          );


        share.className =

        share.type =

        share.textContent =

        dislike.onclick =

      $("messages").appendChild(

    async function checkBackend(){

      try{

            {
              cache:
                "no-store"
            }
          );


        const d =
          await r
            .json()

            );

          d.status ===

        ){

          $("status")

            "Online";

        }else{

        }

      }

    }


    // =====================================================
    // FETCH SICURO
    // =====================================================

    async function fetchJsonOrThrow(
      url,
      options
    ){

      const res =
        await fetch(
          url,
          options
        );


      const raw =
        await res.text();


      let data =
        null;


      try{

        data =
          raw
            ? JSON.parse(raw)
            : null;

      }catch{

        data =
          null;

      }


      if(!res.ok){

        const msg =
          (
            data &&
            (
              data.detail ||
              data.error ||
              data.message
            )
          ) ||
          raw ||
          (
            "HTTP " +
            res.status
          );


        throw new Error(
          "HTTP " +
          res.status +
          " - " +
          msg
        );

      }


      return data;

    }


    // =====================================================
    // CHAT
    // =====================================================

    async function sendMessage(){

      const input =
        $("input");


      if(!input)
        return;


      const text =
        input.value.trim();


      if(!text)
        return;


      ensureConversation();


      input.value =
        "";


      add(
        "user",
        text
      );


      const typing =
        document.createElement(
          "div"
        );


      typing.className =
        "msg ai";


      const typingLine =
        document.createElement(
          "div"
        );


      typingLine.className =
        "message-line";


      const avatar =
        document.createElement(
          "div"
        );


      avatar.className =
        "avatar";


      avatar.textContent =
        "🤖";


      const bubble =
        document.createElement(
          "div"
        );


      bubble.className =
        "bubble";


      bubble.innerHTML =
        `
          <div class="typing">
            <span></span>
            <span></span>
            <span></span>
          </div>
        `;


      typingLine.appendChild(
        avatar
      );


      typingLine.appendChild(
        bubble
      );


      typing.appendChild(
        typingLine
      );


      $("messages").appendChild(
        typing
      );


      $("messages").scrollTop =
        $("messages").scrollHeight;


      $("sendBtn").disabled =
        true;


      try{

        const d =
          await fetchJsonOrThrow(
            API +
            "/chat",
            {

              method:
                "POST",

              headers:{
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body:
                JSON.stringify({

                  message:
                    text,

                  client_id:
                    getActiveClientId()

                })

            }
          );


        typing.remove();


        const outRaw =
          (
            d &&
            typeof d.text ===
              "string"
          )
            ? d.text
            : "";


        const out =
          cleanText(
            outRaw
          ) ||
          "Nessuna risposta.";


        add(
          "ai",
          out
        );


        speak(
          out
        );

      }catch(e){

        typing.remove();


        const errorText =
          "❌ Errore: " +
          (
            e &&
            e.message
              ? e.message
              : "sconosciuto"
          );


        add(
          "ai",
          errorText
        );


        speak(
          "Errore di risposta"
        );

      }finally{

        $("sendBtn").disabled =
          false;


        $("input").focus();

      }

    }


    // =====================================================
    // MICROFONO
    // =====================================================

    function startMic(){

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if(!SpeechRecognition){

        alert(
          "Il microfono non è supportato su questo browser"
        );


        return;

      }


      const recognition =
        new SpeechRecognition();


      recognition.lang =
        "it-IT";


      recognition.interimResults =
        false;


      recognition.continuous =
        false;


      const mic =
        $("micBtn");


      mic.textContent =
        "🔴";


      recognition.onresult =
        function(event){

          const t =
            event
              .results[0][0]
              .transcript;


          $("input").value =
            t;


          sendMessage();

        };


      recognition.onerror =
        function(){

          mic.textContent =
            "🎤";

        };


      recognition.onend =
        function(){

          mic.textContent =
            "🎤";

        };


      try{

        recognition.start();

      }catch{

        mic.textContent =
          "🎤";

      }

    }

        const out =

        add(

        speak(

        );

          "❌ Foto: " +

          );
